# Release WalkMap: push a tag with the version (e.g. 1.14.8) and this
# checks the addon, runs the tests, builds the zip, uploads it to
# CurseForge (project id from ## X-Curse-Project-ID in WalkMap.toc) and
# makes a GitHub release with the same zip and changelog.
# Needs the repository secret CF_API_KEY (a CurseForge API token).
name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua for the tests
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Tag matches the version in WalkMap.toc
        run: |
          version=$(sed -n 's/^## Version: *//p' WalkMap.toc | tr -d '\r')
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME but WalkMap.toc says $version"; exit 1
          fi

      - name: Check, test and build the zip
        run: python3 tools/Release/check.py --zip dist

      - name: Upload to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: python3 tools/Release/upload_curseforge.py dist/WalkMap-${GITHUB_REF_NAME}.zip

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > notes.md
          import re
          text = open("CHANGELOG.md", encoding="utf-8").read()
          tag = "${{ github.ref_name }}"
          m = re.search(r"^## " + re.escape(tag) + r"\s*$(.*?)(?=^## |\Z)", text, re.M | re.S)
          print(m.group(1).strip() if m else "WalkMap " + tag)
          PY
          gh release create "$GITHUB_REF_NAME" "dist/WalkMap-${GITHUB_REF_NAME}.zip" \
            --title "WalkMap $GITHUB_REF_NAME" --notes-file notes.md
