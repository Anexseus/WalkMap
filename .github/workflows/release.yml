# Release WalkMap: push a tag with the version (e.g. 1.14.8) and this
# checks the addon, runs the tests, builds the zip, uploads it to
# CurseForge (project id from ## X-Curse-Project-ID in WalkMap.toc) and
# makes a GitHub release with the same zip and changelog.
# A tag like 1.14.8-beta1 or 1.14.8-alpha1 uploads a Beta or Alpha file
# (only players who choose Beta/Alpha get it) and a GitHub pre-release.
# Needs the repository secret CF_API_KEY (a CurseForge API token).
name: Release

# The same runs for a branch named release/<version> (e.g. release/1.14.8-beta1),
# for sessions that can push branches but not tags; the GitHub release then
# creates the tag.
on:
  push:
    tags:
      - "*"
    branches:
      - "release/*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua for the tests
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Tag matches the version in WalkMap.toc
        run: |
          version=$(sed -n 's/^## Version: *//p' WalkMap.toc | tr -d '\r')
          release="${GITHUB_REF_NAME#release/}"
          case "$release" in
            "$version"|"$version"-*) ;;
            *) echo "Release $release but WalkMap.toc says $version"; exit 1 ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE=$release" >> "$GITHUB_ENV"

      - name: Check, test and build the zip
        run: python3 tools/Release/check.py --zip dist

      - name: Upload to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          RELEASE_TAG: ${{ env.RELEASE }}
        run: python3 tools/Release/upload_curseforge.py "dist/WalkMap-${VERSION}.zip"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > notes.md
          import re
          text = open("CHANGELOG.md", encoding="utf-8").read()
          tag = "${{ env.VERSION }}"
          m = re.search(r"^## " + re.escape(tag) + r"\s*$(.*?)(?=^## |\Z)", text, re.M | re.S)
          print(m.group(1).strip() if m else "WalkMap " + tag)
          PY
          pre=""
          case "$RELEASE" in *-*) pre="--prerelease" ;; esac
          cp "dist/WalkMap-${VERSION}.zip" "dist/WalkMap-${RELEASE}.zip" 2>/dev/null || true
          gh release create "$RELEASE" "dist/WalkMap-${RELEASE}.zip" --target "$GITHUB_SHA" \
            --title "WalkMap $RELEASE" --notes-file notes.md $pre
